[package]
name = "wgpu-mc"
version = "0.2.0"
authors = ["birb"]
edition = "2024"

[features]
default = []
tracing = []

[dependencies]
# if you upgrade this, also change WmRenderer::get_backend_description in wgpu-mc/src/lib.rs
wgpu = { version = "30.0.1", features = ["glsl", "wgsl"] }
#wgpu = { git = "https://github.com/robertream-m42/wgpu.git", features = ["glsl", "wgsl"], branch = "fix/glsl-combined-sampler" }
image = "0.25"
glam = "0.29"
bytemuck = { version = "1.13", features = ["derive"] }
anyhow = "1.0"
winit = "0.30.0"
serde = "1.0.123"
serde_bytes = "0.11.5"
serde_json = "1.0.62"
linked-hash-map = { version = "0.5.6", features = ["serde_impl"] }
serde_derive = "1.0"
guillotiere = "0.6.0"
rayon = "1.5.2"
dashmap = "6.0"
parking_lot = "0.12.1"
arc-swap = "1.4.0"
indexmap = { version = "2.0", features = ["std"] }
multi-map = { git = "https://github.com/rust-embedded-community/multi-map.git" }
serde_with = "3.1.0"
web-sys = "0.3.53"
minecraft-assets = { path = "../minecraft-assets" }
get-size2 = { version = "0.1.2", features = ["derive"] }
log = "0.4.17"
logging_timer = "1.1.0"
treeculler = "0.4"
range-alloc = "0.1.3"
array-init = "2.1.0"
arrayvec = "0.7.6"
itertools = "0.13"
intrusive-collections = "0.9"
encase = "0.9.0"
# `std::time::{Instant, SystemTime}` panic on wasm32-unknown-unknown; this is a re-export of them natively
# and the browser clock on wasm, so the engine's timing code runs unchanged in both.
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# naga 30.0.1's GLSL frontend calls `Binding::apply_default_interpolation`, but the module that
# defines it is only compiled with `spv-in` or `wgsl-in`. Natively `wgpu-core` turns `wgsl-in` on;
# the browser WebGPU backend hands WGSL to the browser and does not, so `glsl` alone fails to build.
# Naming naga here only adds that feature through unification; keep the version equal to wgpu's.
naga = { version = "30.0.1", features = ["wgsl-in"] }
# The engine keeps GPU handles in `static` locks (the game atlas and lightmap in `render/graph.rs`),
# which need `Sync`. The browser backend's handles are only `Send + Sync` with this feature, which is
# sound only while the wasm build has no `atomics`, i.e. runs on one thread. The browser viewer is
# single-threaded for now; enabling `wasm-bindgen-rayon` later means revisiting this.
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
serde_norway = "0.9.42"
# The shader checks read the mod's `.wgsl` sources out of the Neolectrum checkout; this is the crate
# that finds it, and it says what it does when it is not there.
wgpu-mc-modtree = { path = "../modtree" }

[build-dependencies]
cargo-lock = "10.0.1"
