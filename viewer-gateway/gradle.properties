# Kept well below the fork's own 12 GB: this build also configures the included fork and runs the separate
# Kotlin/Native compiler JVM, and both have to fit beside a browser on a 32 GB machine.
org.gradle.jvmargs=-Xmx4096M
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.native.ignoreDisabledTargets=true
# Kotlin/Native tools run in a separate JVM and load bundled native libraries; Java 25 requires explicit native access.
kotlin.native.jvmArgs=--enable-native-access=ALL-UNNAMED
